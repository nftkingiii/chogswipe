<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1618" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Chogswipe</title>
    <meta name="description" content="A Spy vs Spy-style trap-and-raid game for Chog holders on Monad." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #1c1618;
        --paper: #f3eadb;
        --accent: #e0528a;
        --gold: #f0c35a;
      }
      html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #game canvas { display: block; }
      /* desktop: the game sits in a frame on the page instead of taking over the window */
      html.desktop body { background: radial-gradient(circle at 50% 40%, #2c2427, var(--ink) 70%); }
      html.desktop #game canvas { border-radius: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), 0 0 0 4px #000; }

      /* phones held upright: ask for landscape */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: "Patrick Hand", sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone-icon {
        width: 64px;
        height: 110px;
        margin: 0 auto 26px;
        border: 6px solid var(--ink);
        border-radius: 14px;
        background: #fffaf0;
        box-shadow: 5px 6px 0 var(--accent);
        animation: tilt 2.2s ease-in-out infinite;
      }
      #rotate b { display: block; font-family: "Luckiest Guy", sans-serif; font-weight: normal; font-size: 30px; letter-spacing: 1px; }
      #rotate span { display: block; margin-top: 8px; font-size: 21px; color: #5a4d50; }
      @media (orientation: portrait) { html.phone #rotate { display: grid; } }
      @keyframes tilt { 0%, 25% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }

      /* ---------------------------------------------------------------- loader */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 30%, rgba(28, 22, 24, 0.05) 0 2px, transparent 3px) 0 0 / 22px 22px,
          radial-gradient(circle at 70% 60%, rgba(28, 22, 24, 0.04) 0 1px, transparent 2px) 0 0 / 15px 15px,
          var(--paper);
        font-family: "Patrick Hand", sans-serif;
        color: var(--ink);
        transition: opacity 420ms ease, transform 420ms ease;
      }
      #loader.done { opacity: 0; transform: scale(1.02); pointer-events: none; }
      .card { width: min(720px, 92vw); text-align: center; }
      .logo {
        font-family: "Luckiest Guy", sans-serif;
        font-size: clamp(48px, 9vw, 96px);
        letter-spacing: 2px;
        line-height: 1;
        text-shadow: 5px 6px 0 var(--accent);
        animation: wobble 2.4s ease-in-out infinite;
      }
      .tagline { font-size: clamp(18px, 2.6vw, 26px); margin-top: 10px; color: #5a4d50; }

      /* a Chog running across the floor, drawn from the game's own pose sheet */
      .stage { position: relative; height: 190px; margin: 26px auto 8px; overflow: hidden; }
      .floor { position: absolute; left: 0; right: 0; bottom: 20px; height: 5px; background: var(--ink); border-radius: 3px; }
      .runner {
        position: absolute;
        bottom: 18px;
        left: -160px;
        width: 156px;
        height: 156px;
        background: url("/sprites/chog.png") 0 0 / 1248px 156px no-repeat;
        will-change: transform;
      }
      /* the loot: a coin on the floor that pops into a money bag */
      .loot {
        position: absolute;
        bottom: 25px;
        left: 50%;
        width: 54px;
        height: 54px;
        margin-left: -27px;
        display: grid;
        place-items: center;
        font-family: "Luckiest Guy", sans-serif;
        border: 4px solid var(--ink);
        box-sizing: border-box;
        will-change: transform;
      }
      .loot.coin { border-radius: 50%; background: var(--gold); font-size: 26px; }
      .loot.bag {
        width: 66px;
        height: 72px;
        margin-left: -33px;
        border-radius: 46% 46% 42% 42% / 38% 38% 58% 58%;
        background: #c9a46a;
        font-size: 30px;
        padding-top: 10px;
      }
      .loot.bag::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 50%;
        width: 26px;
        height: 14px;
        margin-left: -13px;
        background: #b38b52;
        border: 4px solid var(--ink);
        border-radius: 6px 6px 2px 2px;
      }
      .poof { position: absolute; bottom: 40px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--gold); border: 2px solid var(--ink); opacity: 0; }

      .bar { width: min(460px, 80vw); height: 22px; margin: 14px auto 0; border: 4px solid var(--ink); border-radius: 14px; background: #fffaf0; overflow: hidden; box-shadow: 4px 5px 0 var(--ink); }
      .fill { height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, #ea6ea0 14px 28px); animation: fill 3s ease-out forwards; }
      .status { margin-top: 10px; font-size: 20px; color: #5a4d50; min-height: 26px; }

      .tip {
        display: flex;
        align-items: center;
        gap: 14px;
        width: min(560px, 90vw);
        margin: 22px auto 0;
        padding: 12px 18px;
        text-align: left;
        background: #fffaf0;
        border: 4px solid var(--ink);
        border-radius: 18px;
        box-shadow: 5px 6px 0 var(--ink);
      }
      .molandak { flex: none; width: 72px; height: 72px; background: url("/sprites/monanimals.png") 0 0 / 360px 72px no-repeat; }
      .tip b { display: block; font-family: "Luckiest Guy", sans-serif; font-weight: normal; font-size: 15px; color: #7e5ce0; letter-spacing: 1px; }
      .tip span { font-size: 19px; }
      .demo { margin-top: 14px; font-size: 15px; color: #8a7d70; }

      @keyframes fill { to { width: 100%; } }
      @keyframes wobble { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
      @media (prefers-reduced-motion: reduce) {
        .logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="card">
        <div class="logo">CHOGSWIPE</div>
        <div class="tagline">Sneak in. Swipe the $CHOG. Get out.</div>
        <div class="stage" aria-hidden="true">
          <div class="loot coin" id="loot">$</div>
          <div class="runner" id="runner"></div>
          <div class="floor"></div>
        </div>
        <div class="bar"><div class="fill"></div></div>
        <div class="status" id="loader-status">Picking the lock…</div>
        <div class="tip">
          <div class="molandak" aria-hidden="true"></div>
          <div><b>MOLANDAK SAYS</b><span id="loader-tip">Your Chog's traits are its gadgets. Check them before every heist.</span></div>
        </div>
      </div>
    </div>
    <div id="rotate" role="alert">
      <div>
        <div class="phone-icon" aria-hidden="true"></div>
        <b>TURN YOUR PHONE</b>
        <span>Chogswipe plays sideways. Rotate to landscape, then tap to go full screen.</span>
      </div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
